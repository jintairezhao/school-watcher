  - name: '学院文字列表（独立标题与时间）'
    list_selector: '#textList .list-page > a.list-item-wrapper:has(.i-title):has(.i-time), #list .list-page > a:has(.i-title):has(.i-time)'
    title_selector: '.i-title'
