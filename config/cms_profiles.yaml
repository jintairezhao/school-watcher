    link_selector: 'a.card'
    date_selector: 'span.time, span.date'
    content_selector: 'div.article-content, div.content, .article, article'

# ---- 日期解析格式（按优先级顺序，第一个命中即生效） ----
# pattern 是 Python 正则（捕获组），format 标签决定如何组装：
#   year-month-day         3 组：年/月/日（如 2026-08-23、2026.08.23）
#   month-day-year         3 组：月/日/年（如 07-042026）
#   year-month-day-concat  3 组：年月-日（如 202607-08）
#   year-month-day-compact 3 组：纯数字紧凑（如 20260719）
#   month-name-day-year    3 组：英文月 日 年（如 Jan 19, 2026）
#   day-month-name-year    3 组：日 英文月 年（如 19 Jul 2026）
#   day-month              2 组：日/月，年份推断（如 1707月）
#   month-day              2 组：月/日，年份推断（如 7月8日）
#   year-month             2 组：年/月，日缺省为 1（如 2026-05）
# 可选字段 flags：正则标志（如 'IGNORECASE'，用于英文月份忽略大小写）
date_patterns:
  # 明确的日期块分两行显示“日 年-月”，须先于仅有年月的回退规则。
  - pattern: '^\s*(\d{1,2})\s*(20\d{2})[-/.](\d{1,2})\s*$'
    format: 'day-year-month'

  - pattern: '(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})日?'
    format: 'year-month-day'

  - pattern: '(\d{4})[-/](\d{1,2})[-/](\d{1,2})'
    format: 'year-month-day'

  - pattern: '(\d{4})\.(\d{1,2})\.(\d{1,2})'
    format: 'year-month-day'

  # 月-日 年：ZCMS 的 middleArticle__dates 用 <br/> 分两行（06-20\n2025），需容忍空白
  - pattern: '(\d{1,2})-(\d{1,2})\s*(\d{4})'
    format: 'month-day-year'

  - pattern: '(\d{4})(\d{1,2})-(\d{1,2})'
    format: 'year-month-day-concat'

  - pattern: '(\d{1,2})(\d{1,2})月'
    format: 'day-month'

  - pattern: '(\d{1,2})月(\d{1,2})日'
    format: 'month-day'

  - pattern: '(\d{4})-(\d{1,2})(?![\d-])'
    format: 'year-month'

  # ---- 以下为 dom_analyzer 原 DATE_REGEX_PATTERNS 迁入（更广覆盖） ----
  - pattern: '(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?'
    format: 'year-month-day'

  - pattern: '(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})'
    format: 'year-month-day'

  - pattern: '(\d{1,2})月\s*(\d{1,2})日?'
    format: 'month-day'

  - pattern: '(\d{4})(\d{2})(\d{2})'
    format: 'year-month-day-compact'

  - pattern: '(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})'
    format: 'month-name-day-year'
    flags: 'IGNORECASE'

  - pattern: '(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{4})'
    format: 'day-month-name-year'
    flags: 'IGNORECASE'

  - pattern: '[\[（(](\d{4})[-/.]?(\d{1,2})[-/.]?(\d{1,2})[\]）)]'
    format: 'year-month-day'

  - pattern: '【(\d{4})[-/.]?(\d{1,2})[-/.]?(\d{1,2})】'
    format: 'year-month-day'

  # ---- 通用栏目布局补充 ----
  # 博达多校「日 + 年月」拼接（北航 26 2026.08 / 中大 29 2026/08 / 清华 27 2026.08）
  - pattern: '(\d{1,2})\s+(\d{4})\.(\d{1,2})(?!\d)'
    format: 'day-year-month'

  - pattern: '(\d{1,2})\s+(\d{4})/(\d{1,2})(?!\d)'
    format: 'day-year-month'

  # 电子科大混合型 2026.07-22（年.月-日）
  - pattern: '(\d{4})\.(\d{1,2})-(\d{1,2})'
    format: 'year-month-day'

  # Drupal 相对时间（9小时前 / 3天前）
  - pattern: '(\d+)\s*(分钟前|小时前|天前)'
    format: 'relative'
