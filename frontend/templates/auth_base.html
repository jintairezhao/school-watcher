<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f5f5f7" id="themeColor">
    <title>{% block title %}学校通知{% endblock %}</title>
    <script>
    (function () {
        try {
            var t = localStorage.getItem('theme');
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/typography.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/redesign.css">
    <link rel="icon" href="/static/img/icon.svg">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
    // 认证页不加载 app.js：这里单独给 fetch 的写方法补 CSRF 头
    (function () {
        var _fetch = window.fetch;
        window.fetch = function (input, init) {
            init = init || {};
            var method = (init.method || 'GET').toUpperCase();
            if (['POST', 'PUT', 'DELETE', 'PATCH'].indexOf(method) >= 0) {
                init.headers = new Headers(init.headers || {});
                if (!init.headers.has('X-CSRF-Token')) {
                    var m = document.querySelector('meta[name="csrf-token"]');
                    if (m) init.headers.set('X-CSRF-Token', m.content);
                }
            }
            return _fetch(input, init);
        };
    })();
    </script>
    <style>
        .login-container {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(300px, 0.8fr) minmax(440px, 1.2fr);
            align-items: center;
            background: var(--color-bg);
        }
        .login-context {
            align-self: stretch;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(32px, 5vw, 72px);
            color: #eef2f8;
            background: #172033;
        }
        .login-context-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: var(--text-control);
            font-weight: 600;
        }
        .login-context-mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            color: #fff;
            background: #2457d6;
        }
        .login-context-copy { max-width: 420px; }
        .login-context-copy p:first-child {
            margin: 0 0 14px;
            color: #8eacf9;
            font-size: var(--text-meta);
            font-weight: 600;
            letter-spacing: 0.14em;
        }
        .login-context-copy h2 {
            margin: 0;
            color: #fff;
            font-size: var(--text-display);
            line-height: 1.12;
            letter-spacing: normal;
        }
        .login-context-copy p:last-child {
            max-width: 32em;
            margin: 22px 0 0;
            color: #b8c2d2;
            font-size: var(--text-body);
            line-height: 1.75;
        }
        .login-context-path {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #9ea9bb;
            font-size: var(--text-meta);
        }
        .login-context-path i {
            width: 22px;
            height: 1px;
            background: rgba(255,255,255,.22);
        }
        .login-card {
            width: 100%;
            max-width: 480px;
            justify-self: center;
            padding: 3.5rem 2.5rem;
            text-align: left;
        }
        .login-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            margin-bottom: 1.4rem;
            border: 1px solid var(--color-border);
            border-radius: 9px;
            color: var(--color-primary);
            background: var(--color-primary-subtle);
        }
        .login-title {
            font-size: var(--text-page-title);
            font-weight: 600;
            margin: 0 0 0.25rem;
            color: var(--color-text);
        }
        .login-subtitle {
            font-size: var(--text-control);
            color: var(--color-text-secondary);
            margin: 0 0 1.5rem;
        }
        .login-form { text-align: left; }
        .login-form .form-group { margin-bottom: 1.25rem; }
        .login-form label {
            display: block;
            font-size: var(--text-control);
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--color-text);
        }
        .login-form .form-input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            font-size: var(--text-body);
            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-input);
            background: var(--color-surface-2);
            color: var(--color-text);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-form .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-ring);
        }
        .login-error {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            padding: 0.6rem 0.75rem;
            border-radius: var(--radius-input);
            font-size: var(--text-control);
            margin-bottom: 1rem;
            text-align: center;
        }
        .login-btn {
            width: 100%;
            padding: 0.7rem;
            font-size: var(--text-body);
            font-weight: 600;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: background-color 160ms;
        }
        .login-forgot-wrap { margin-top: 1rem; text-align: center; }
        .login-forgot {
            font-size: var(--text-meta);
            color: var(--color-text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-forgot:hover {
            color: var(--color-primary);
            text-decoration: underline;
        }
        .login-footer {
            margin-top: 1.25rem;
            font-size: var(--text-meta);
            color: var(--color-text-secondary);
        }
        @media (max-width: 760px) {
            .login-container { display: block; }
            .login-context {
                min-height: auto;
                padding: 18px 20px;
            }
            .login-context-copy,
            .login-context-path { display: none; }
            .login-card {
                max-width: 520px;
                margin: 0 auto;
                padding: 42px 22px 56px;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inbox-surface.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/supporting-surfaces.css') }}">
</head>
<body>
    <main class="login-container">
        <aside class="login-context" aria-label="产品介绍">
            <div class="login-context-brand">
                <span class="login-context-mark" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>
                学校通知
            </div>
            <div class="login-context-copy">
                <h2>把散落的通知，<br>收进一条时间线。</h2>
                <p>按学校、部门与年月筛选，只看和你有关的消息。</p>
            </div>
            <div class="login-context-path"><span>学校</span><i></i><span>部门</span><i></i><span>通知</span></div>
        </aside>
        <section class="login-card">
            {% block card %}{% endblock %}
        </section>
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
