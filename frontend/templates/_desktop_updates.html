{% if config.DESKTOP_MODE %}
<aside id="desktopUpdateNotice" class="desktop-update-notice" data-i18n-aria-label="软件更新" aria-label="{{ tr('软件更新') }}" hidden>
    <p id="desktopUpdateMessage" role="status" aria-live="polite"></p>
    <div class="desktop-update-actions">
        <button id="desktopUpdateOpen" type="button" class="btn btn-primary btn-sm" data-i18n="查看更新">{{ tr("查看更新") }}</button>
        <button id="desktopUpdateDismiss" type="button" class="btn btn-outline btn-sm"><span data-i18n="稍后">{{ tr("稍后") }}</span></button>
    </div>
</aside>
<link rel="stylesheet" href="{{ url_for('static', filename='css/desktop-updates.css') }}">
<script src="{{ url_for('static', filename='js/desktop-updates.js') }}" defer></script>
{% endif %}
