{% if config.DESKTOP_FRAMELESS %}
{% if not desktop_controls_only|default(false) %}
<header class="desktop-admin-bar"><a class="desktop-app-name" href="{{ url_for('pages.index') }}">学校通知</a><span class="desktop-app-section">系统管理</span><div class="desktop-drag pywebview-drag-region" aria-label="拖动窗口"></div>
{% endif %}
<div class="desktop-chrome" id="desktopChrome">
    <details class="desktop-menu"><summary aria-label="应用菜单" title="应用菜单"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary><div>
        <button type="button" data-window-action="updates">检查更新</button>
        <button type="button" data-window-action="components">采集组件</button>
        <button type="button" data-window-action="locations">文件位置</button>
        <button type="button" data-window-action="data">打开数据文件夹</button>
    </div></details>
    <button type="button" data-window-action="minimize" aria-label="最小化" title="最小化"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
    <button type="button" data-window-action="maximize" aria-label="最大化或还原" title="最大化或还原"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
    <button type="button" class="desktop-close" data-window-action="close" aria-label="关闭" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
{% if not desktop_controls_only|default(false) %}</header>{% endif %}
<div class="desktop-resize" id="desktopResize" aria-hidden="true"></div>
<link rel="stylesheet" href="{{ url_for('static', filename='css/desktop-chrome.css') }}">
<script src="{{ url_for('static', filename='js/desktop-chrome.js') }}" defer></script>
{% endif %}
