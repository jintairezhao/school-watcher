{% extends "auth_base.html" %}
{% block title %}注册 — 学校通知{% endblock %}

{% block card %}
    <div class="login-icon" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div>
    <h1 class="login-title">创建账户</h1>
    <p class="login-subtitle">订阅你关注的学校通知</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="login-form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username"
                   class="form-input" placeholder="2-32 个字符"
                   autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password"
                   class="form-input" placeholder="至少 8 位"
                   autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="confirm">确认密码</label>
            <input type="password" id="confirm" name="confirm"
                   class="form-input" placeholder="再次输入密码"
                   autocomplete="new-password">
        </div>
        <button type="submit" class="login-btn">注 册</button>
    </form>

    <p class="login-forgot-wrap">
        已有账户？<a href="/login" class="login-forgot">去登录</a>
    </p>

    <p class="login-footer">创建账户后即可选择要订阅的学校。</p>
{% endblock %}
