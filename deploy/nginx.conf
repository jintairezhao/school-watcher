events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    include /etc/nginx/mime.types;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $public_scheme { default $http_x_forwarded_proto; '' $scheme; }
    upstream application { server web:5000; }
    server {
        listen 8080;
        client_max_body_size 100m;
        location /internal/ { return 404; }
        location = /_browser_authorize {
            internal;
            proxy_pass http://application/api/admin/browser-access/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
        }
        location ~ ^/browser-access/([a-f0-9]+)/websocket$ {
            set $verification_id $1;
            auth_request /_browser_authorize;
            access_log off;
            error_log /dev/null;
            proxy_pass http://browser:8765/v1/manual/$verification_id/websocket$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 650s;
        }
        location /browser-access/ { return 404; }
        location /browser-client/ {
            alias /usr/share/novnc/;
            autoindex off;
        }
        location / {
            proxy_pass http://application;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_read_timeout 120s;
        }
    }
}
