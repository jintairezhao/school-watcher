name: Runtime acceptance
on:
  workflow_dispatch:
  push:
    branches: [main, codex/security-fixes, codex/desktop-onboarding]
    paths: ['app.py', 'backend/**', 'frontend/**', 'scripts/**', 'tests/**', 'migrations/**', 'requirements.txt', 'requirements/**', 'config/**', 'deploy/**', '.dockerignore', '.github/workflows/runtime.yml']
  pull_request:
    paths: ['app.py', 'backend/**', 'frontend/**', 'scripts/**', 'tests/**', 'migrations/**', 'requirements.txt', 'requirements/**', 'config/**', 'deploy/**', '.dockerignore', '.github/workflows/runtime.yml']
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14.3'}
      - run: python -m pip install -r requirements/test.txt
      - run: python -m playwright install chromium
      - name: Verify untrusted content in a real browser
        run: python tests/browser/check_security_browser.py
      - name: Verify desktop onboarding and feedback
        run: python tests/browser/check_desktop_onboarding_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify desktop storage and file location controls
        run: python tests/browser/check_desktop_storage_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify import and export progress, speed and large-file recovery
        run: python tests/browser/check_transfer_browser.py
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Verify inbox reading, favorites and filter memory
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          python -c "import runpy; runpy.run_path('tests/browser/check_inbox_views_browser.py')['check'](capture=False)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/browser/check_inbox_filter_memory_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m unittest discover -s tests -p "test_*.py"
        env:
          SECRET_KEY: isolated-ci-session-key
      - name: Documented migration and minimal-runtime checks
        run: |
          python tests/smoke/check_migration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke/check_minimal_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          SECRET_KEY: isolated-ci-session-key
  linux-postgres-and-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: isolated_ci_postgres_password
      SECRET_KEY: isolated_ci_session_secret_never_deploy
      FIELD_ENC_KEY: isolated_ci_field_secret_never_deploy
      WATCHER_BROWSER_TOKEN: isolated_ci_browser_token_64_characters_for_test_environment_only
      WATCHER_PUBLIC_ORIGIN: https://fixture.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker compose -f deploy/compose.yaml build --pull
      - run: docker compose -f deploy/compose.yaml up -d
      - name: Create isolated test databases
        run: |
          docker compose -f deploy/compose.yaml exec -T db createdb -U watcher watcher_runtime_test
          docker compose -f deploy/compose.yaml exec -T db createdb -U watcher watcher_drill_admin
      - name: Provider and runtime tests
        run: >-
          docker compose -f deploy/compose.yaml run --rm --no-deps
          -e WATCHER_TEST_POSTGRES_URI=postgresql+psycopg://watcher:isolated_ci_postgres_password@db:5432/watcher_runtime_test
          -e WATCHER_TEST_MIGRATION_ADMIN_URI=postgresql+psycopg://watcher:isolated_ci_postgres_password@db:5432/watcher_drill_admin
          web python -m unittest discover -s tests -p 'test_*.py'
      - name: Chromium fixture tests in sandbox
        run: >-
          docker compose -f deploy/compose.yaml run --rm --no-deps
          -e WATCHER_ORIGIN_BROKER_URL= -e WATCHER_BROWSER_EGRESS_PROXY=
          browser python -m unittest discover -s tests -p 'test_browser_runtime_real.py'
      - name: Gateway and worker readiness
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 100
      - name: Stop isolated deployment
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
