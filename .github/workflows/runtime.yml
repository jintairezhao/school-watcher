name: Runtime acceptance
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ['app.py', 'backend/**', 'frontend/**', 'scripts/**', 'tests/**', 'migrations/**', 'requirements.txt', 'requirements/**', 'config/**', 'deploy/**', '.dockerignore', '.github/workflows/runtime.yml']
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14.3'}
      - run: python -m pip install -r requirements/test.txt
      - run: python -m playwright install chromium
      - name: Verify untrusted content in a real browser
        run: python tests/browser/check_security_browser.py
      - name: Verify desktop onboarding and feedback
        run: python tests/browser/check_desktop_onboarding_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify desktop storage and file location controls
        run: python tests/browser/check_desktop_storage_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify import and export progress, speed and large-file recovery
        run: python tests/browser/check_transfer_browser.py
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Verify migration dialog progress and cancellation
        run: python tests/browser/check_desktop_migration_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify live directory search and startup update reminders
        run: python tests/browser/check_directory_updates_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify API usage charts and analytics interactions
        run: python tests/browser/check_ai_usage_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify pause and resume for school discovery
        run: python tests/browser/check_discovery_pause_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify department and column subscription tree
        run: python tests/browser/check_subscription_structure_browser.py
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify AI configuration and source review recovery
        run: |
          python tests/browser/check_shared_ai_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/browser/check_source_review_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          WATCHER_TEST_BROWSER_CHANNEL: chromium
      - name: Verify inbox reading, favorites and filter memory
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          python -c "import runpy; runpy.run_path('tests/browser/check_inbox_views_browser.py')['check'](capture=False)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/browser/check_inbox_filter_memory_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m unittest discover -s tests -p "test_*.py"
        env:
          SECRET_KEY: isolated-ci-session-key
      - name: Documented migration and minimal-runtime checks
        run: |
          python tests/smoke/check_migration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke/check_minimal_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          SECRET_KEY: isolated-ci-session-key
  historical-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: watcher
          POSTGRES_PASSWORD: isolated_ci_postgres_password
          POSTGRES_DB: watcher_runtime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U watcher -d watcher_runtime_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SECRET_KEY: isolated_ci_session_secret_never_deploy
      FIELD_ENC_KEY: isolated_ci_field_secret_never_deploy
      WATCHER_TEST_POSTGRES_URI: postgresql+psycopg://watcher:isolated_ci_postgres_password@127.0.0.1:5432/watcher_runtime_test
      WATCHER_TEST_MIGRATION_ADMIN_URI: postgresql+psycopg://watcher:isolated_ci_postgres_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14.3'}
      - run: python -m pip install -r requirements/test.txt
      - name: Verify historical database compatibility in isolation
        run: python -m unittest discover -s tests -p "test_*.py"
