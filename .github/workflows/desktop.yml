name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main', 'codex/desktop-release', 'codex/security-fixes', 'codex/desktop-onboarding']
    paths: ['app.py', 'desktop/**', 'backend/**', 'frontend/**', 'requirements.txt', 'requirements/**', 'migrations/**', 'scripts/**', 'tests/**', 'config/**', 'deploy/**', '.github/workflows/desktop.yml', '.github/workflows/runtime.yml']
  pull_request:
    paths: ['desktop/**', 'requirements/desktop.txt', 'requirements/build.txt', 'tests/test_desktop*.py', 'config/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    uses: ./.github/workflows/runtime.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: windows-x64}
          - {os: macos-15, target: macos-arm64}
          - {os: macos-15-intel, target: macos-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      WATCHER_DATA_DIR: ${{ github.workspace }}/.local/ci-data
      WATCHER_ENV_FILE: ${{ github.workspace }}/.local/ci-data/.env
      SECRET_KEY: isolated-ci-desktop-key-never-distributed
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/desktop-browsers
      WATCHER_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.3'
          cache: pip
          cache-dependency-path: 'requirements/*.txt'
      - name: Install build dependencies
        run: python -m pip install -r requirements/build.txt
      - name: Check desktop behavior and update integrity
        run: python -m unittest discover -s tests -p 'test_desktop*.py' -v
      - name: Check imported content and session security
        run: python -m unittest discover -s tests -p 'test_security*.py' -v
      - name: Verify native startup update notification
        run: python tests/smoke/check_startup_updates.py
      - name: Prepare Windows WebView2 bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/desktop-build | Out-Null
          $bootstrapper = Join-Path $PWD '.local/desktop-build/MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 signature' }
          "WATCHER_WEBVIEW_BOOTSTRAPPER=$bootstrapper" | Out-File -FilePath $env:GITHUB_ENV -Append
          'C:\Program Files (x86)\Inno Setup 6' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build Windows application and installer
        if: runner.os == 'Windows'
        run: python desktop/build.py --installer
      - name: Verify in-place upgrade preserves custom locations
        if: runner.os == 'Windows'
        run: python tests/smoke/check_installer_upgrade.py
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        run: python desktop/build.py
      - name: Verify Windows packaged runtime and Chromium
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $PWD '.local/desktop-dist/SchoolWatcher/SchoolWatcher.exe'
          $data = Join-Path $PWD '.local/packaged-smoke'
          $report = Join-Path $PWD '.local/packaged-smoke.json'
          $proc = Start-Process -FilePath $app -ArgumentList @('--smoke-test','--data-dir',"`"$data`"",'--report',"`"$report`"") -WindowStyle Hidden -PassThru
          if (-not $proc.WaitForExit(1200000)) { Stop-Process -Id $proc.Id; throw 'Packaged runtime timed out' }
          if ($proc.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Packaged runtime failed' }
          Get-Content -LiteralPath $report
          $guiReport = Join-Path $PWD '.local/packaged-gui.json'
          $gui = Start-Process -FilePath $app -ArgumentList @('--gui-smoke-test','--data-dir',"`"$data`"",'--report',"`"$guiReport`"") -WindowStyle Hidden -PassThru
          if (-not $gui.WaitForExit(90000)) { Stop-Process -Id $gui.Id; throw 'Native window timed out' }
          if ($gui.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $guiReport)) { throw 'Native window failed' }
      - name: Verify macOS packaged runtime and Chromium
        if: runner.os == 'macOS'
        run: >-
          '.local/desktop-dist/School Watcher.app/Contents/MacOS/SchoolWatcher'
          --smoke-test --data-dir "$PWD/.local/packaged-smoke" --report "$PWD/.local/packaged-smoke.json"
      - name: Verify macOS native window
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          subprocess.run(['.local/desktop-dist/School Watcher.app/Contents/MacOS/SchoolWatcher',
              '--gui-smoke-test', '--data-dir', str(Path('.local/packaged-smoke').resolve()),
              '--report', str(Path('.local/packaged-gui.json').resolve())], check=True, timeout=90)
          assert Path('.local/packaged-gui.json').is_file()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # The packaged app has now downloaded the isolated browser itself.
        with:
          name: desktop-${{ matrix.target }}
          path: .local/desktop-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: desktop-debug-${{ matrix.target }}
          path: |
            .local/packaged-smoke/desktop.log
            .local/packaged-smoke/desktop-*.log
            .local/ci-data/desktop-*.log
            .local/desktop-build/work/**/warn-*.txt
          retention-days: 3
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'desktop-*', path: artifacts}
      - name: Publish validated installers and combined checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$(python -c 'from desktop import VERSION; print(VERSION)')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$TAG"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump desktop.VERSION to publish a new version."
            exit 0
          fi
          mkdir release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp '{}' release/ \;
          (cd release && sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt)
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "School Watcher $TAG" --notes-file desktop/RELEASE_NOTES.md --latest
