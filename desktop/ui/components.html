<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采集组件</title>
<style>*{box-sizing:border-box}body{margin:0;padding:36px;background:#f5f5f7;color:#1d1d1f;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}h1{font-size:26px;margin:0 0 4px;letter-spacing:-.6px}#message{margin:22px 0 14px;font-weight:600}.hint{font-size:13px;color:#6e6e73}button{border:0;border-radius:8px;background:#0071e3;color:white;padding:11px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #78adff;outline-offset:3px}progress{width:100%;height:8px;accent-color:#0071e3;margin-bottom:20px}</style>
<h1>采集组件</h1><p class="hint">优先使用已有的 Edge 或 Chrome。需要时下载独立组件，不会更改你的浏览器或浏览记录。</p><p id="message" role="status" aria-live="polite">正在检测…</p><p id="browser" class="hint"></p><progress id="progress"></progress><button id="retry" disabled>重新检测</button>
<script>
const retry=document.getElementById('retry');
function paint(s){document.getElementById('message').textContent=s.message;document.getElementById('browser').textContent=s.browser?'正在使用：'+s.browser:'';const busy=['checking','downloading'].includes(s.phase);document.getElementById('progress').hidden=!busy;retry.disabled=busy;}
retry.onclick=async()=>{retry.disabled=true;try{paint(await window.pywebview.api.retry());}catch(e){retry.disabled=false;document.getElementById('message').textContent='暂时无法重新检测，请重试。';}};
window.addEventListener('pywebviewready',()=>{window.pywebview.api.state().then(paint);setInterval(()=>window.pywebview.api.state().then(paint),1000);});
</script></html>
