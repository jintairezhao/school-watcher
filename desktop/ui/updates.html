<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="检查更新">检查更新</title>
<style>*{box-sizing:border-box}body{margin:0;padding:36px;background:#f5f5f7;color:#1d1d1f;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}h1{font-size:26px;margin:0 0 4px;letter-spacing:-.6px}#version,.hint{font-size:13px;color:#6e6e73}#message{margin:22px 0 14px;font-weight:600}#notes{white-space:pre-wrap;max-height:170px;overflow:auto;font-size:13px;color:#515154}button{border:0;border-radius:8px;background:#0071e3;color:white;padding:11px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #78adff;outline-offset:3px}progress{width:100%;height:8px;accent-color:#0071e3;margin-bottom:20px}.hint{margin-top:18px}</style>
<h1 data-i18n="软件更新">软件更新</h1><div id="version"></div><p id="message" role="status" aria-live="polite" data-i18n="正在准备检查">正在准备检查</p><div id="notes" data-official-content></div><progress id="progress" value="0" max="100" hidden data-i18n-aria-label="下载进度" aria-label="下载进度"></progress><button id="action" disabled data-i18n="检查更新">检查更新</button><p class="hint" data-i18n="安装前会再次确认。订阅、收藏和阅读记录会保留。">安装前会再次确认。订阅、收藏和阅读记录会保留。</p>
<script>
let state={phase:'idle'};const button=document.getElementById('action');
function paint(s){window.I18n.setLocale(s.locale);state=s;document.getElementById('version').textContent=uiT('当前版本 {version}',{version:s.current});document.getElementById('message').textContent=uiT(s.message);document.getElementById('notes').textContent=s.notes||'';const p=document.getElementById('progress');p.hidden=s.phase!=='downloading';p.value=s.progress||0;button.disabled=['checking','downloading','installing'].includes(s.phase);button.textContent=({available:uiT('下载更新'),'download-error':uiT('重新下载'),ready:uiT('立即更新'),installing:uiT('正在准备更新'),checking:uiT('正在检查'),downloading:uiT('正在下载')})[s.phase]||uiT('重新检查');}
button.onclick=async()=>{const action=state.phase==='ready'?'install':['available','download-error'].includes(state.phase)?'download':'check';button.disabled=true;try{paint(await window.pywebview.api[action]());}catch(e){document.getElementById('message').textContent=uiT('操作未完成，请重试');button.disabled=false;}};
window.addEventListener('pywebviewready',async()=>{paint(await window.pywebview.api.state());if(['idle','latest','error'].includes(state.phase))window.pywebview.api.check().then(paint);setInterval(()=>window.pywebview.api.state().then(paint),500);});
</script></html>
