# ============================================================
# 学校通知扒取工具 - 学校配置
# 中国石油大学（北京）克拉玛依校区
# ============================================================
#
# 部门结构说明：
#   - 组织机构板块对照官网组织机构表
#     （https://www.cupk.edu.cn/c/2017-04-21/485097.shtml）：
#     父部门 = 单位名称，子部门 = 表中蓝色链接（有独立子站点的挂靠单位/业务口），
#     用「父-子」命名约定在部门栏呈现父子系关系
#   - 列表 URL 优先用 /tzgg/ 归档页；无归档页（404/403）的用子站首页，
#     首次抓取时引擎自动探测列表
#   - 二级弹窗选项规则（2026-08-29 用户确认）：
#     挂靠单位/备注里所有蓝色链接均为子部门（含与父同站、介绍页）；
#     单位子站内部含通知的栏目同样视为子部门（见文件末尾发现块）
#   - 学院（院系设置）单独成组，不挂在组织机构下
#
# ZCMS Catalog ID 对照表：
#   AJAX 部门：
#     15887 = 学生工作与安全保卫部 (xgybw)
#     18144 = 研究生部 (yjsb)
#     17669 = 创新创业学院 (cxcy，组织机构表中挂靠教务部)
#   学院（tzgg 路径分页 30 条后断裂，必须用 catalog 端点翻全页）：
#     15315 = 地球科学与工程学院 (syxy)
#     19814 = 石油工程学院 (sgxy)
#     15250 = 化工与环境学院 (gxy)
#     19594 = 机电工程学院 (jdxy)
#     19742 = 数理与人工智能学院 (szxy)
#     15413 = 人文学院 (wlxy)
#     17291 = 马克思主义学院 (smxy)
#   （xcxy 新能源与材料、gsxy 工商管理 无 catalog 端点，仍用 tzgg 路径）
#
# 注意：
#   - YAML 导入仅在启动时运行，且只增不更新
#   - 修改已有部门需通过 API：PUT /api/departments/<id>
#   - SINCE_YEAR=2024 只抓取2024年至今的通知
# ============================================================

schools:
